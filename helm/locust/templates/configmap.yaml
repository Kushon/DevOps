apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.locustTest.name }}-locustfile
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: locust
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Оператор монтирует ключи ConfigMap в /lotest/src/.
  # Сценарий аналогичен Части 2: чтение ресурсов cat-api.
  locustfile.py: |
    from locust import HttpUser, task, between


    class CatApiUser(HttpUser):
        wait_time = between(0.1, 0.5)

        @task(3)
        def list_cats(self):
            # Основной эндпоинт «получение ресурсов»
            self.client.get("/", name="GET /")

        @task(1)
        def search_cat(self):
            self.client.get("/cats?cat_name=alpha", name="GET /cats?cat_name")
