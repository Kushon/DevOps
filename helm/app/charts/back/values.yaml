# Values for cat-api backend (back) subchart
# These values override or extend the global values from the parent chart

# Namespace can be overridden; if empty, uses global.namespace from parent values
namespace: ""

# Deployment replicas
replicas: 1

# Image configuration for cat-api backend
image:
  repository: "cat-api"
  tag: "latest"
  pullPolicy: "Never"

# Service configuration
service:
  type: "ClusterIP"
  port: 8000
  targetPort: 8000
  annotations: {}

# Database connection settings
database:
  # Connection protocol
  protocol: "postgresql+asyncpg"
  # Database hostname (uses postgres service in the same namespace by default)
  host: "app-postgres-service"
  port: "5432"
  name: "postgres"
  # Reference to the secret containing database credentials
  secretRef:
    # Name of the secret resource (usually created by postgres subchart)
    name: "app-postgres-secrets"
    # Key in the secret for database user
    userKey: "POSTGRES_USER"
    # Key in the secret for database password
    passwordKey: "POSTGRES_PASSWORD"

# Deployment labels and annotations
labels:
  app: "cat-api"
  version: "1.0"

annotations:
  prometheus.io/scrape: "false"

# Resource limits and requests
# Значения подобраны по стресс-тесту Locust (см. loadtest/README.md).
# Профиль: приложение CPU-bound — на нагрузке упиралось в лимит 500m уже при 300 юзерах,
# память держится низко (пик ~105Mi). Поэтому поднимаем CPU-лимит (запас под burst до того,
# как HPA добавит реплики), память приводим к реальному пику с запасом.
# requests.cpu=250m задаёт базу для HPA (target 60% => скейл при ~150m средних).
resources:
  limits:
  # было 500m/512Mi 
    cpu: "1000m"
    memory: "256Mi"
  requests:
  # было 100m
    cpu: "250m"
    memory: "128Mi"

# Horizontal Pod Autoscaler (HPA) для backend API.
# Требует заданных requests.cpu и работающего metrics-server.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  # Целевая средняя утилизация CPU относительно requests.cpu
  targetCPUUtilizationPercentage: 60
  # Память по умолчанию не масштабируем (оставить пустым, чтобы отключить метрику)
  targetMemoryUtilizationPercentage: ""
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # Окно стабилизации перед уменьшением числа реплик
      stabilizationWindowSeconds: 300

# Vertical Pod Autoscaler (VPA) — режим рекомендаций.
# Требует установленного VPA (recommender/updater/admission-controller) в кластере.
vpa:
  enabled: true
  # "Off" = только рекомендации, без авто-применения (не конфликтует с HPA по CPU)
  updateMode: "Off"
  minAllowed:
    cpu: "50m"
    memory: "64Mi"
  maxAllowed:
    cpu: "1"
    memory: "1Gi"

# Pod security and configuration
securityContext:
  runAsNonRoot: false
  runAsUser: 0

# Liveness and readiness probes
livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

# Environment variables (in addition to database connection vars)
env:
  # Add custom environment variables here
  - name: "LOG_LEVEL"
    value: "INFO"
